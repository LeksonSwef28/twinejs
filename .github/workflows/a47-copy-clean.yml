name: A47 Copy Clean

on:
  push:
    branches:
      - audit/a47-dynamic-effect-references-clean

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/a47-dynamic-effect-references-clean
          fetch-depth: 0
      - name: Copy audited A47 files from staging branch
        shell: bash
        run: |
          git fetch origin audit/a47-dynamic-effect-references
          git checkout origin/audit/a47-dynamic-effect-references -- \
            93DAYS_A47_EDITOR_PRODUCT_AUDIT.md \
            93DAYS_ROADMAP_A47_A52_EDITOR_PRODUCT.md \
            src/components/narrative/workspace/outcome-effects-panel.tsx \
            src/components/narrative/workspace/character-reference-select.tsx \
            src/components/narrative/workspace/__tests__/character-reference-select.test.ts
          rm .github/workflows/a47-copy-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(93-days): author Move-relative effect character references'
          git push origin HEAD:audit/a47-dynamic-effect-references-clean
