name: A48 Diagnostic Jump Source Patch

on:
  push:
    branches:
      - audit/a48-diagnostic-jump-source

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/a48-diagnostic-jump-source
      - name: Apply staged patch
        run: python .github/scripts/a48_jump_source_patch.py
      - name: Commit product changes
        shell: bash
        run: |
          rm .github/scripts/a48_jump_source_patch.py
          rm .github/workflows/a48-jump-source-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(93-days): jump from diagnostics to authoring sources'
          git push origin HEAD:audit/a48-diagnostic-jump-source
