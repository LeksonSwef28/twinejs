name: A48 Unreachable Story Patch

on:
  push:
    branches:
      - audit/a48-unreachable-story-diagnostics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/a48-unreachable-story-diagnostics
      - name: Apply staged patch
        run: python .github/scripts/a48_unreachable_story_patch.py
      - name: Commit product changes
        shell: bash
        run: |
          rm .github/scripts/a48_unreachable_story_patch.py
          rm .github/workflows/a48-unreachable-story-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(93-days): diagnose isolated and unreachable Story nodes'
          git push origin HEAD:audit/a48-unreachable-story-diagnostics
