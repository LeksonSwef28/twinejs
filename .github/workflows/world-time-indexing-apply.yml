name: Format World Time indexing

on:
  push:
    branches:
      - audit/world-time-indexing

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/world-time-indexing
      - name: Format changed TypeScript
        run: npx --yes prettier@2.8.8 --write src/components/narrative/workspace/world-time-workspace.tsx src/components/narrative/workspace/world-time-indexes.ts src/components/narrative/workspace/__tests__/world-time-indexes.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/narrative/workspace/world-time-workspace.tsx src/components/narrative/workspace/world-time-indexes.ts src/components/narrative/workspace/__tests__/world-time-indexes.test.ts
          git commit -m 'style(93-days): format World Time indexing [world-time-formatted]'
          git push origin HEAD:audit/world-time-indexing
