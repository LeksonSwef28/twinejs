name: A47 Knowledge Effect Patch

on:
  push:
    branches:
      - audit/a47-knowledge-effect-closure

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/a47-knowledge-effect-closure
      - name: Apply staged patch
        run: python .github/scripts/a47_knowledge_effect_patch.py
      - name: Commit product changes
        shell: bash
        run: |
          rm .github/scripts/a47_knowledge_effect_patch.py
          rm .github/workflows/a47-knowledge-effect-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(93-days): complete knowledge effect authoring UI'
          git push origin HEAD:audit/a47-knowledge-effect-closure
