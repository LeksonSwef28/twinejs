name: Run schema v3 migration patch

on:
  push:
    branches:
      - audit/schema-v3-migration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/schema-v3-migration
      - name: Apply staged patch
        shell: bash
        run: |
          if ! grep -q 'narrativeProjectSchemaVersion = 2' src/domain/narrative/project.ts; then
            echo 'Schema migration already applied.'
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/schema-v3-migration-apply.yml').read_text()
          marker = "          python3 <<'PY'\n"
          body = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, 'schema-v3-staged-patch.py', 'exec'))
          PY
      - name: Commit migration patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/narrative/project.ts src/store/narrative-project/repository.ts src/store/narrative-project/recoverable-repository.ts src/store/narrative-project/__tests__/schema-v3-migration.test.ts
          git commit -m 'fix(93-days): freeze schema v3 migration path [schema-v3-applied]'
          git push origin HEAD:audit/schema-v3-migration
