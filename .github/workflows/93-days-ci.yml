name: 93 Days Branch Check

on:
  push:
    branches: [93-days-editor]
  pull_request:
    branches: [93-days-editor]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22.12.0
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit (diagnostic)
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');
          const printReport = (path, label) => {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const vulnerabilities = report.vulnerabilities ?? {};
            const order = {critical: 0, high: 1, moderate: 2, low: 3, info: 4};
            const rows = Object.entries(vulnerabilities)
              .map(([name, value]) => ({name, ...value}))
              .sort((a, b) =>
                (order[a.severity] ?? 99) - (order[b.severity] ?? 99) ||
                a.name.localeCompare(b.name)
              );
            console.log(`\n=== ${label} ===`);
            console.log('metadata:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const item of rows) {
              const via = (item.via ?? []).map(entry =>
                typeof entry === 'string'
                  ? entry
                  : `${entry.title} (${entry.url})`
              );
              console.log(`\n[${String(item.severity).toUpperCase()}] ${item.name}`);
              console.log(`direct=${Boolean(item.isDirect)} range=${item.range}`);
              console.log(`via=${via.join(' | ') || '(none)'}`);
              console.log(`effects=${(item.effects ?? []).join(', ') || '(none)'}`);
              console.log(`fixAvailable=${JSON.stringify(item.fixAvailable)}`);
            }
          };
          printReport('/tmp/npm-audit.json', 'FULL TREE');
          printReport('/tmp/npm-audit-prod.json', 'PRODUCTION TREE (--omit=dev)');
          NODE
          echo '=== WHY THESE PACKAGES ARE INSTALLED ==='
          for package in shell-quote lodash i18next-http-backend @playwright/test @faker-js/faker vite-plugin-node-polyfills; do
            echo "--- npm explain $package ---"
            npm explain "$package" || true
          done
          echo '=== SAFE NON-FORCE FIX DRY RUN ==='
          npm audit fix --package-lock-only --dry-run || true
      - name: Lint
        run: npm run lint
      - name: Build web application
        run: npm run build:web
      - name: Build Electron main process
        run: npm run build:electron-main
      - name: Run test suite
        run: npm run test:coverage -- --maxWorkers=2
      - name: Smoke-start Vite
        shell: bash
        run: |
          npm run start -- --host 127.0.0.1 > /tmp/93-days-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /tmp/93-days-home.html; then
              echo "Vite responded successfully."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/93-days-vite.log
          exit 1
      - name: Smoke-start Electron
        shell: bash
        run: |
          xvfb-run -a npm run start:electron:boot -- --no-sandbox > /tmp/93-days-electron.log 2>&1 &
          ELECTRON_PID=$!
          sleep 12
          if kill -0 "$ELECTRON_PID" 2>/dev/null; then
            echo "Electron stayed alive for the smoke window."
            kill "$ELECTRON_PID" || true
            wait "$ELECTRON_PID" || true
            exit 0
          fi
          echo "Electron exited before the smoke window finished."
          cat /tmp/93-days-electron.log
          exit 1
