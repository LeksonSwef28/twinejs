name: 93 Days Branch Check

on:
  push:
    branches: [93-days-editor]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build web application
        run: npm run build:web
      - name: Build Electron main process
        run: npm run build:electron-main
      - name: Run test suite
        run: npm run test:coverage -- --maxWorkers=2
      - name: Smoke-start Vite
        shell: bash
        run: |
          npm run start -- --host 127.0.0.1 > /tmp/93-days-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /tmp/93-days-home.html; then
              echo "Vite responded successfully."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/93-days-vite.log
          exit 1
      - name: Smoke-start Electron
        shell: bash
        run: |
          xvfb-run -a npm run start:electron:boot -- --no-sandbox > /tmp/93-days-electron.log 2>&1 &
          ELECTRON_PID=$!
          sleep 12
          if kill -0 "$ELECTRON_PID" 2>/dev/null; then
            echo "Electron stayed alive for the smoke window."
            kill "$ELECTRON_PID" || true
            wait "$ELECTRON_PID" || true
            exit 0
          fi
          echo "Electron exited before the smoke window finished."
          cat /tmp/93-days-electron.log
          exit 1
