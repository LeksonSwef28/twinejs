name: A48 Reaction Reference Patch

on:
  push:
    branches:
      - audit/a48-reaction-reference-validation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/a48-reaction-reference-validation
      - name: Apply A48 reaction reference validation
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/a48_patch.py
          python /tmp/a48_patch.py
          rm .github/workflows/a48-reaction-reference-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(93-days): validate reaction candidate references'
          git push origin HEAD:audit/a48-reaction-reference-validation
