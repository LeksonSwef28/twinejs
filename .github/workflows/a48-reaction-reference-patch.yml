name: A48 Reaction Reference Patch

on:
  push:
    branches:
      - audit/a48-reaction-reference-validation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/a48-reaction-reference-validation
      - name: Apply A48 reaction reference validation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected fragment not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          validation = 'src/domain/narrative/project-reference-validation.ts'

          replace_once(
              validation,
              "\t| 'story-connection'\n\t| 'narrative-move';",
              "\t| 'story-connection'\n\t| 'narrative-move'\n\t| 'reaction-candidate-set';"
          )
          replace_once(
              validation,
              "\t| 'story-node'\n\t| 'outcome';",
              "\t| 'story-node'\n\t| 'narrative-move'\n\t| 'outcome';"
          )
          replace_once(
              validation,
              "\titemInstances: Set<string>;\n\tstoryNodes: Set<string>;",
              "\titemInstances: Set<string>;\n\tstoryNodes: Set<string>;\n\tnarrativeMoves: Set<string>;"
          )

          marker = "\n/**\n * A48 read-only validation for authored references."
          helper = r'''
function validateReactionCandidateSet(
	findings: NarrativeReferenceFinding[],
	sets: ReferenceSets,
	set: NarrativeProject['reactionCandidateSets'][number]
) {
	const context: FindingContext = {
		ownerKind: 'reaction-candidate-set',
		ownerId: set.id,
		storyNodeId: set.storyNodeId,
		characterId: set.reactingCharacterId
	};
	addMissingReference(
		findings,
		sets.storyNodes,
		'story-node',
		set.storyNodeId,
		context,
		`Reaction set «${set.id}»: Story node`
	);
	addMissingReference(
		findings,
		sets.characters,
		'character',
		set.reactingCharacterId,
		context,
		`Reaction set «${set.id}»: reacting character`
	);
	addMissingReference(
		findings,
		sets.characters,
		'character',
		set.counterpartCharacterId,
		context,
		`Reaction set «${set.id}»: counterpart character`
	);

	for (const candidate of set.candidates) {
		addMissingReference(
			findings,
			sets.narrativeMoves,
			'narrative-move',
			candidate.moveId,
			context,
			`Reaction candidate «${candidate.id}»: Move`
		);
		for (const guard of candidate.guards) {
			validateCondition(
				findings,
				sets,
				guard.condition,
				context,
				`Reaction candidate «${candidate.id}» guard «${guard.label ?? guard.id}»`
			);
		}
		for (const consideration of candidate.considerations) {
			if (consideration.type === 'knows-claim') {
				addMissingReference(
					findings,
					sets.claims,
					'claim',
					consideration.claimId,
					context,
					`Reaction candidate «${candidate.id}»: Claim consideration`
				);
			} else if (consideration.type === 'story-node-state') {
				addMissingReference(
					findings,
					sets.storyNodes,
					'story-node',
					consideration.storyNodeId,
					context,
					`Reaction candidate «${candidate.id}»: Story consideration`
				);
			}
		}
	}
}
'''
          p = Path(validation)
          text = p.read_text()
          if marker not in text:
              raise SystemExit('Validation insertion marker missing')
          p.write_text(text.replace(marker, '\n' + helper + marker, 1))

          replace_once(
              validation,
              "\t\titemInstances: new Set(project.itemInstances.map(entity => entity.id)),\n\t\tstoryNodes: new Set(project.storyNodes.map(entity => entity.id))",
              "\t\titemInstances: new Set(project.itemInstances.map(entity => entity.id)),\n\t\tstoryNodes: new Set(project.storyNodes.map(entity => entity.id)),\n\t\tnarrativeMoves: new Set(project.narrativeMoves.map(entity => entity.id))"
          )
          replace_once(
              validation,
              "\tfor (const move of project.narrativeMoves) {\n\t\tvalidateMove(findings, sets, move);\n\t}\n\n\treturn {findings};",
              "\tfor (const move of project.narrativeMoves) {\n\t\tvalidateMove(findings, sets, move);\n\t}\n\tfor (const set of project.reactionCandidateSets) {\n\t\tvalidateReactionCandidateSet(findings, sets, set);\n\t}\n\n\treturn {findings};"
          )

          test_path = Path('src/domain/narrative/__tests__/project-reference-validation.test.ts')
          test_text = test_path.read_text()
          test_case = r'''

	it('finds broken references inside Reaction Candidate Sets', () => {
		const value = project();
		value.reactionCandidateSets = [
			{
				id: 'reaction-set-1',
				storyNodeId: 'missing-reaction-story',
				reactingCharacterId: 'missing-reactor',
				counterpartCharacterId: 'missing-counterpart',
				candidates: [
					{
						id: 'candidate-1',
						moveId: 'missing-move',
						valence: 'negative',
						baseScore: 1,
						guards: [
							{
								id: 'reaction-guard-1',
								condition: {
									type: 'character-knows-claim',
									characterId: 'missing-guard-character',
									claimId: 'missing-guard-claim'
								}
							}
						],
						considerations: [
							{
								id: 'claim-consideration',
								type: 'knows-claim',
								claimId: 'missing-consideration-claim',
								weight: 1
							},
							{
								id: 'story-consideration',
								type: 'story-node-state',
								storyNodeId: 'missing-consideration-story',
								state: 'completed',
								weight: 2
							}
						]
					}
				]
			}
		];

		const findings = validateNarrativeProjectReferences(value).findings;
		const targets = findings.map(finding => `${finding.targetKind}:${finding.targetId}`);

		expect(targets).toEqual(
			expect.arrayContaining([
				'story-node:missing-reaction-story',
				'character:missing-reactor',
				'character:missing-counterpart',
				'narrative-move:missing-move',
				'character:missing-guard-character',
				'claim:missing-guard-claim',
				'claim:missing-consideration-claim',
				'story-node:missing-consideration-story'
			])
		);
		expect(
			findings.every(finding => finding.ownerKind === 'reaction-candidate-set')
		).toBe(true);
	});
'''
          if not test_text.endswith('\n});\n'):
              raise SystemExit('Unexpected test file ending')
          test_path.write_text(test_text[:-4] + test_case + '\n});\n')

          replace_once(
              'src/components/narrative/workspace/story-brain-panel.tsx',
              "\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tИщет пустые исходы, асимметрию веток и места, где исполняемая\n\t\t\t\t\t\t\t линия заканчивается раньше ожидаемого.\n\t\t\t\t\t\t</p>",
              "\t\t\t\t\t\t<p>\n\t\t\t\t\t\t\tИщет пустые исходы, асимметрию веток, ранние окончания и битые\n\t\t\t\t\t\t\t authored-ссылки, включая зависимости Reaction Candidate Sets.\n\t\t\t\t\t\t</p>"
          )
          PY
          rm .github/workflows/a48-reaction-reference-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(93-days): validate reaction candidate references"
          git push origin HEAD:audit/a48-reaction-reference-validation
