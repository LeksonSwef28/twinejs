name: A47 Dynamic Effect References Patch

on:
  push:
    branches:
      - audit/a47-dynamic-effect-references

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/a47-dynamic-effect-references
      - name: Repair staged item matcher
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/a47_dynamic_effect_refs_patch.py')
          text = path.read_text()
          old = "text = replace_once(text, old_item, new_item, 'item effect')"
          new = "item_start = text.index(\"\\t\\t\\tcase 'item-set-placement':\")\nitem_end = text.index(\"\\t\\t\\tcase 'story-node-set-state':\", item_start)\ntext = text[:item_start] + new_item + text[item_end:]"
          if old not in text:
              raise SystemExit('item matcher call not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply staged patch
        run: python .github/scripts/a47_dynamic_effect_refs_patch.py
      - name: Commit product changes
        shell: bash
        run: |
          rm .github/scripts/a47_dynamic_effect_refs_patch.py
          rm .github/workflows/a47-dynamic-effect-refs-patch.yml
          rm -f A47_DYNAMIC_EFFECT_REFS_TRIGGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(93-days): author Move-relative effect character references'
          git push origin HEAD:audit/a47-dynamic-effect-references
