name: A48 WORLD/TIME Diagnostic Navigation Patch

on:
  push:
    branches:
      - audit/a48-world-time-diagnostic-navigation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/a48-world-time-diagnostic-navigation
      - name: Apply staged patch
        run: python .github/scripts/a48_world_time_diagnostic_nav_patch.py
      - name: Commit product changes
        shell: bash
        run: |
          rm .github/scripts/a48_world_time_diagnostic_nav_patch.py
          rm .github/workflows/a48-world-time-diagnostic-nav-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(93-days): jump schedule diagnostics to WORLD/TIME'
          git push origin HEAD:audit/a48-world-time-diagnostic-navigation
